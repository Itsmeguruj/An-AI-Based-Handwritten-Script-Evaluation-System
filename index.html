<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepScript // AI Handwritten Evaluation Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Instant Pre-Hydration Theme Initializer (prevents flicker and guarantees reload persistence) -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('deepscript_theme') || localStorage.getItem('theme');
          var isLight = t === 'light';
          if (isLight) {
            document.documentElement.classList.add('light-theme');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.remove('light-theme');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          }
          document.addEventListener('DOMContentLoaded', function() {
            try {
              if (isLight && document.body) {
                document.body.classList.add('light-theme');
                document.body.setAttribute('data-theme', 'light');
              }
            } catch(e) {}
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Immediate Body Theme Application -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('deepscript_theme') || localStorage.getItem('theme');
          var isLight = t === 'light';
          if (isLight) {
            document.body.classList.add('light-theme');
            document.body.setAttribute('data-theme', 'light');
            document.documentElement.classList.add('light-theme');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.body.classList.remove('light-theme');
            document.body.setAttribute('data-theme', 'dark');
            document.documentElement.classList.remove('light-theme');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
